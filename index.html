<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Map – Inky Vibes Tattoo</title>
  <style>
    :root{--radius:16px;--shadow:0 18px 45px rgba(0,0,0,.25)}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:#fff}
    .wrap{max-width:980px;margin:0 auto;padding:18px}
    .map-card{
      position:relative;
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      background:#000;
    }
    .map{
      width:100%;
      height:420px;
      border:0;
      display:block;
      filter:saturate(1.05) contrast(1.02);
    }
    /* overlay title card */
    .overlay{
      position:absolute;
      z-index:10;
      left:12px;
      top:12px;
      background:rgba(0,0,0,.75);
      color:#fff;
      border-radius:8px;
      padding:8px 12px;
      min-width:160px;
      max-width:calc(100% - 24px);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .overlay h3{
      margin:0 0 2px;
      font-size:13px;
      font-weight:800;
      letter-spacing:.2px;
    }
    .overlay p.address {
      margin: 0 0 5px 0;
      font-size: 10px;
      color: #e0e0e0;
    }
    
    /* Metallic Text Link with slow shine pulse */
    .overlay a{
      text-decoration:none;
      font-size: 11px;
      font-weight:700;
      display:inline-flex;
      gap:4px;
      align-items:center;
      pointer-events: auto;
      
      background: linear-gradient(110deg, #b8b8b8 10%, #ffffff 30%, #757575 50%, #ffffff 70%, #b8b8b8 90%);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: shine 8s linear infinite;
    }
    .overlay a:hover{opacity:.9}
    
    @keyframes shine {
      to { background-position: 200% center; }
    }

    .pin{
      width:14px;height:14px;display:inline-block
    }

    @media (max-width:520px){
      .map{height:360px}
      .overlay{left:10px;top:10px;padding:6px 10px; min-width:140px;}
      .overlay h3{font-size:12px}
      .overlay p.address {font-size: 9px; margin-bottom: 4px;}
      .overlay a{font-size: 10px;}
      .pin{width:12px;height:12px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="map-card">
      <div class="overlay" aria-label="Inky Vibes Tattoo location">
        <h3>Inky Vibes Tattoo</h3>
        <p class="address">Keskikatu 13, 45100 Kouvola (Sokoksen takapihalla)</p>
        
        <a href="https://www.google.com/maps/place/Inky+Vibes+Tattoo,+Keskikatu+13,+45100+Kouvola,+Finlandiya/@60.868616,26.705737,15z/data=!4m6!3m5!1s0x4691b39ed920d2d9:0xb1594d066ec57b1a!8m2!3d60.8686155!4d26.7057374!16s%2Fg%2F11rq8gs5jm?entry=ml&utm_campaign=ml-p&coh=230964&g_ep=Eg1tbF8yMDI2MDEyOF8xIOC7DCoASAJQAg%3D%3D"
           target="_blank" rel="noopener">
          <svg class="pin" viewBox="0 0 24 24" fill="none">
            <defs>
              <linearGradient id="metallicGrad" x1="0%" y1="0%" x2="200%" y2="0%">
                <stop offset="10%" stop-color="#b8b8b8" />
                <stop offset="30%" stop-color="#ffffff" />
                <stop offset="50%" stop-color="#757575" />
                <stop offset="70%" stop-color="#ffffff" />
                <stop offset="90%" stop-color="#b8b8b8" />
                <animate attributeName="x1" from="0%" to="-200%" dur="8s" repeatCount="indefinite" />
                <animate attributeName="x2" from="200%" to="0%" dur="8s" repeatCount="indefinite" />
              </linearGradient>
            </defs>
            <path d="M12 22s7-6.1 7-12a7 7 0 1 0-14 0c0 5.9 7 12 7 12z" fill="url(#metallicGrad)" opacity=".9"/>
            <circle cx="12" cy="10" r="2.6" fill="black" opacity=".55"/>
          </svg>
          Open in Google Maps
        </a>
      </div>

      <iframe
        class="map"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps?q=Inky%20Vibes%20Tattoo%20Keskikatu%2013%2045100%20Kouvola%20Finland&output=embed">
      </iframe>
    </div>
  </div>
</body>
</html>
